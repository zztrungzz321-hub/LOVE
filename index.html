<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Love confession</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="matrixCanvas"></canvas>
    <canvas id="dotCanvas"></canvas>
    <div class="background-grid"></div>
    <div class="burst-layer" id="burstLayer"></div>
    <div class="petal-layer" id="petalLayer"></div>
    <div class="container">
      <div class="card">
        <div class="signal"></div>
        <p class="tiny-label" id="tinyLabel">SẴN SÀNG • GỬI TÌNH YÊU</p>
        <h1 id="mainText">EM CÓ BIẾT KHÔNG?</h1>
        <p class="message" id="messageText">Nhấn vào ổ khóa lớn để nhập tên và bắt đầu 💖</p>
        <button class="heart-lock" id="heartLock" type="button" aria-label="Mở khóa trái tim">
          <span class="heart-lock__icon">🔒</span>
          <span class="heart-lock__text">MỞ KHÓA</span>
        </button>
        <div class="unlock-modal" id="unlockModal" aria-hidden="true">
          <div class="unlock-modal__card">
            <p class="unlock-modal__title">Nhập tên của em</p>
            <input class="unlock-modal__input" id="unlockNameInput" type="text" maxlength="24" placeholder="Ví dụ: Mai..." />
            <div class="unlock-modal__actions">
              <button class="unlock-modal__button unlock-modal__button--primary" id="unlockConfirmBtn" type="button">Tiếp tục</button>
              <button class="unlock-modal__button" id="unlockCancelBtn" type="button">Đóng</button>
            </div>
          </div>
        </div>
        <div class="countdown-shell" id="countdownShell">
          <div class="countdown" id="countdown">10</div>
          <div class="countdown-subtitle" id="countdownSubtitle">00:10</div>
        </div>
        <button class="love-trigger" id="loveTrigger" type="button">I LOVE YOU</button>
        <div class="status" id="statusLine">[LOVE-001] Bắt đầu hiệu ứng</div>
      </div>
    </div>

    <div class="scene-transition" id="sceneTransition" aria-hidden="true"></div>
    <div class="heart-overlay" id="heartOverlay" aria-hidden="true">
      <div class="heart-shape"><span>I LOVE YOU</span></div>
    </div>
    <div class="sakura-layer" id="sakuraLayer" aria-hidden="true"></div>
    <audio id="finalAudio" src="music.mp4" type="audio/mp4" loop preload="auto"></audio>

    <script src="script.js"></script>
  </body>
</html>
